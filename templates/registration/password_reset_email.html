<!doctype html>
<html lang="pt-BR">
<body style="margin:0;background:#f8fafc;color:#020617;font-family:Inter,Arial,sans-serif;padding:32px 16px">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #e2e8f0;border-radius:18px;padding:32px">
    <p style="margin:0 0 24px;color:#1d4ed8;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase">ENGP</p>
    <h1 style="margin:0;color:#06145b;font-size:32px;line-height:1.08;letter-spacing:-.05em">Crie uma nova senha.</h1>
    <p style="margin:20px 0;color:#64748b;font-size:16px;line-height:1.7">Recebemos uma solicitação para redefinir a senha da sua conta.</p>
    <p style="margin:28px 0"><a href="{{ protocol }}://{{ domain }}{% url 'accounts:password_reset_confirm' uidb64=uid token=token %}" style="display:inline-block;background:#1d4ed8;color:#fff;border-radius:12px;padding:14px 20px;font-weight:600;text-decoration:none">Redefinir senha</a></p>
    <p style="margin:0;color:#94a3b8;font-size:13px;line-height:1.6">Se você não solicitou esta alteração, ignore este e-mail.</p>
  </div>
</body>
</html>
