{% with current_url=request.resolver_match.url_name current_app=request.resolver_match.app_name %}
<aside class="workspace-sidebar" aria-label="Navegação principal">
  <div class="workspace-sidebar-brand">
    {% include 'registration/_brand.html' %}
  </div>

  <nav class="workspace-sidebar-nav" aria-label="Menu principal">
    <a class="workspace-sidebar-link{% if current_url == 'home' %} is-active{% endif %}" href="{% url 'accounts:home' %}" aria-label="Visão geral" data-tooltip="Visão geral"{% if current_url == 'home' %} aria-current="page"{% endif %}>
      <span class="workspace-sidebar-icon" aria-hidden="true"><i data-lucide="layout-dashboard" class="workspace-sidebar-lucide"></i></span>
    </a>
    <a class="workspace-sidebar-link{% if current_app == 'tasks' %} is-active{% endif %}" href="{% url 'tasks:inbox' %}" aria-label="Tarefas" data-tooltip="Tarefas"{% if current_app == 'tasks' %} aria-current="page"{% endif %}>
      <span class="workspace-sidebar-icon" aria-hidden="true">
        <svg class="workspace-sidebar-svg" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="8" height="4" x="8" y="2" rx="1" ry="1"/>
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
          <path d="M12 11h4"/>
          <path d="M12 16h4"/>
          <path d="M8 11h.01"/>
          <path d="M8 16h.01"/>
        </svg>
      </span>
    </a>
    <a class="workspace-sidebar-link{% if current_app == 'routines' %} is-active{% endif %}" href="{% url 'routines:weekly' %}" aria-label="Rotina semanal" data-tooltip="Rotina semanal"{% if current_app == 'routines' %} aria-current="page"{% endif %}>
      <span class="workspace-sidebar-icon" aria-hidden="true"><i data-lucide="calendar-days" class="workspace-sidebar-lucide"></i></span>
    </a>
    <a class="workspace-sidebar-link{% if current_app == 'categories' %} is-active{% endif %}" href="{% url 'categories:list' %}" aria-label="Categorias" data-tooltip="Categorias"{% if current_app == 'categories' %} aria-current="page"{% endif %}>
      <span class="workspace-sidebar-icon" aria-hidden="true"><i data-lucide="tags" class="workspace-sidebar-lucide"></i></span>
    </a>
    <a class="workspace-sidebar-link{% if current_app == 'accounts' and current_url != 'home' %} is-active{% endif %}" href="{% url 'accounts:settings' %}" aria-label="Configurações" data-tooltip="Configurações"{% if current_app == 'accounts' and current_url != 'home' %} aria-current="page"{% endif %}>
      <span class="workspace-sidebar-icon" aria-hidden="true">
        <svg class="workspace-sidebar-svg" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 10.27 7 3.34"/>
          <path d="m11 13.73-4 6.93"/>
          <path d="M12 22v-2"/>
          <path d="M12 2v2"/>
          <path d="M14 12h8"/>
          <path d="m17 20.66-1-1.73"/>
          <path d="m17 3.34-1 1.73"/>
          <path d="M2 12h2"/>
          <path d="m20.66 17-1.73-1"/>
          <path d="m20.66 7-1.73 1"/>
          <path d="m3.34 17 1.73-1"/>
          <path d="m3.34 7 1.73 1"/>
          <circle cx="12" cy="12" r="2"/>
          <circle cx="12" cy="12" r="8"/>
        </svg>
      </span>
    </a>
  </nav>

  <div class="workspace-sidebar-footer">
    <a class="workspace-sidebar-user" href="{% url 'accounts:settings' %}" aria-label="Perfil" data-tooltip="Perfil">
      <span class="workspace-sidebar-avatar" aria-hidden="true">
        <svg class="workspace-sidebar-svg" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </span>
    </a>
    <form method="post" action="{% url 'accounts:logout' %}">
      {% csrf_token %}
      <button class="workspace-sidebar-logout" type="submit" aria-label="Sair" data-tooltip="Sair">
        <i data-lucide="log-out" class="workspace-sidebar-lucide" aria-hidden="true"></i>
      </button>
    </form>
  </div>
</aside>
{% endwith %}
